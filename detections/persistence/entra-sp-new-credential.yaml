id: e72f6aee-c128-4f6d-9465-38e2346d9d66
name: Credencial nueva anadida a una aplicacion o service principal
description: >
  Detecta cuando se agrega un secreto o un certificado a una aplicacion registrada o a un
  service principal. Es persistencia silenciosa: con esa credencial el atacante se autentica
  como la aplicacion, sin usuario, sin MFA y sin depender de la contrasena que le robo. Es de
  las tecnicas mas usadas para mantener acceso despues de que le cierran la puerta de entrada.
severity: High
severityJustification: >
  High porque otorga acceso NO INTERACTIVO y persistente que sobrevive al cambio de contrasena
  y al reset de MFA del usuario comprometido. Las respuestas habituales a un compromiso no lo
  quitan, asi que el acceso queda aunque el incidente se de por cerrado.
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1098.001
query: |
  AuditLogs
  | where TimeGenerated > ago(1h)
  | where OperationName has_any (
      "Update application - Certificates and secrets management",
      "Update service principal",
      "Add service principal credentials")
  | where Result == "success"
  | extend Actor = tostring(InitiatedBy.user.userPrincipalName)
  | extend App = tostring(TargetResources[0].displayName)
  | project TimeGenerated, OperationName, Actor, App, CorrelationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Actor
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: App
falsePositives:
  - scenario: Rotacion planificada de secretos por vencimiento.
    howToDistinguish: >
      La rotacion la hace una identidad de automatizacion conocida y en ventana de mantenimiento.
      Un secreto agregado por un usuario interactivo fuera de horario es lo sospechoso.
  - scenario: Despliegue de una aplicacion nueva por el equipo de desarrollo.
    howToDistinguish: Cruzar con el registro de cambios y confirmar que la app existia desde antes.
responseSteps:
  - "Identificar quien agrego la credencial y si tiene motivo para hacerlo."
  - "Revisar QUE permisos tiene esa aplicacion: una app con Mail.ReadWrite es muy distinta a una de solo lectura."
  - "Si no esta justificado: eliminar la credencial y revisar todo lo que hizo esa app desde que se creo."
validationStatus:
  state: syntax-only-not-executed
  notes: Los nombres exactos de OperationName varian entre tenants; verificar en el propio antes de desplegar.
version: 1.0.0
kind: Scheduled
