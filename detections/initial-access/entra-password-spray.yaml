id: 8f3b1c94-2d5e-4a71-9c8f-6b0e5d2a7143
name: Password spraying contra Entra ID desde una sola IP
description: >
  Detecta el patron caracteristico del password spraying: una misma direccion IP intentando
  autenticarse contra MUCHOS usuarios distintos con POCOS intentos por usuario, para no
  disparar los bloqueos por cuenta. Se diferencia de la fuerza bruta clasica —muchos intentos
  contra un usuario— y por eso los umbrales miran usuarios distintos, no cantidad de fallos.
severity: Medium
severityJustification: >
  Medium y no High porque el spraying es reconocimiento de credenciales: por si solo no implica
  compromiso. Sube a incidente cuando esta regla correlaciona con un inicio de sesion exitoso
  desde la misma IP, que es lo que cubre la regla de fatiga de MFA.
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  SigninLogs
  | where TimeGenerated > ago(1h)
  | where ResultType != 0
  | summarize
      UsuariosDistintos = dcount(UserPrincipalName),
      Intentos = count(),
      Usuarios = make_set(UserPrincipalName, 20)
      by IPAddress, bin(TimeGenerated, 15m)
  | where UsuariosDistintos >= 10 and Intentos < UsuariosDistintos * 3
  | project TimeGenerated, IPAddress, UsuariosDistintos, Intentos, Usuarios
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
falsePositives:
  - scenario: Un proxy corporativo o NAT concentra el trafico de toda la oficina en una IP.
    howToDistinguish: >
      Los fallos vienen repartidos en el dia y con ResultType de contrasena vencida o MFA
      pendiente, no de credencial invalida. Comparar contra la linea base de esa IP.
  - scenario: Un escaneo de seguridad autorizado o una prueba de red team.
    howToDistinguish: >
      Cruzar la IP con el rango del proveedor y con la ventana de la prueba acordada.
responseSteps:
  - Confirmar si la IP pertenece a un rango corporativo conocido antes de bloquear nada.
  - Revisar si alguno de los usuarios afectados tuvo un inicio de sesion EXITOSO desde esa IP.
  - "Si hubo exito, tratar como compromiso: revocar sesiones y forzar cambio de contrasena."
  - "Si no hubo exito: bloquear la IP y verificar que todos los afectados tengan MFA activo."
validationStatus:
  state: syntax-only-not-executed
  notes: >
    Escrita y validada sintacticamente. No ejecutada aun contra datos reales: requiere un
    tenant con SigninLogs poblado y volumen suficiente para calibrar el umbral de 10 usuarios.
version: 1.0.0
kind: Scheduled
